const STORAGE_KEY = "wgdp_data_v2";
function loadData() {
  try { const r = localStorage.getItem(STORAGE_KEY); return r ? JSON.parse(r) : { completions:{}, lang:"en", streak:0, lastDate:null }; }
  catch { return { completions:{}, lang:"en", streak:0, lastDate:null }; }
}
function saveData(d) { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); } catch {} }
function getDateKey(date) { return date.getFullYear()+"-"+String(date.getMonth()+1).padStart(2,"0")+"-"+String(date.getDate()).padStart(2,"0"); }

function App() {
  const [store, setStore] = useState(loadData);
  const [tab, setTab] = useState("today");
  const [now, setNow] = useState(new Date());
  const [aiMessages, setAiMessages] = useState([]);
  const [aiInput, setAiInput] = useState("");
  const [aiLoading, setAiLoading] = useState(false);
  const [shareToast, setShareToast] = useState(false);
  const [confetti, setConfetti] = useState([]);
  const [celebTask, setCelebTask] = useState(null);

  const lang = store.lang || "en";
  const t = T[lang];
  const tasks = TASKS_DATA[lang];
  const todayKey = getDateKey(now);

  useEffect(() => { const iv = setInterval(() => setNow(new Date()), 60000); return () => clearInterval(iv); }, []);
  useEffect(() => { saveData(store); }, [store]);

  useEffect(() => {
    const yesterday = new Date(now); yesterday.setDate(yesterday.getDate()-1);
    const yk = getDateKey(yesterday);
    if (store.lastDate && store.lastDate !== todayKey) {
      const comp = store.completions[yk] || {};
      const rate = Object.values(comp).filter(Boolean).length / tasks.length;
      if (rate >= 0.7 && store.lastDate === yk) setStore(s=>({...s, streak:(s.streak||0)+1, lastDate:todayKey}));
      else if (store.lastDate !== yk) setStore(s=>({...s, streak:0, lastDate:todayKey}));
    }
  }, [todayKey]);

  const todayComp = store.completions[todayKey] || {};
  const completedCount = Object.values(todayComp).filter(Boolean).length;
  const totalTasks = tasks.length;
  const pct = Math.round((completedCount/totalTasks)*100);

  function toggleTask(id) {
    const newVal = !todayComp[id];
    setStore(s=>({...s, completions:{...s.completions,[todayKey]:{...todayComp,[id]:newVal}}, lastDate:todayKey}));
    if (newVal) { setCelebTask(id); launchConfetti(); setTimeout(()=>setCelebTask(null),1000); }
  }

  function launchConfetti() {
    const pieces = Array.from({length:18},(_,i)=>({ id:i, x:Math.random()*100, color:["#FFD700","#FF6B6B","#4FC3F7","#81C784","#CE93D8"][i%5], size:Math.random()*8+4, delay:Math.random()*0.5 }));
    setConfetti(pieces); setTimeout(()=>setConfetti([]),2000);
  }

  function resetToday() { setStore(s=>({...s, completions:{...s.completions,[todayKey]:{}}})); }

  function getWeekData() {
    const result = [];
    for (let i=6;i>=0;i--) { const d=new Date(now); d.setDate(d.getDate()-i); const key=getDateKey(d); const comp=store.completions[key]||{}; const done=Object.values(comp).filter(Boolean).length; result.push({day:t.weekdays[d.getDay()],pct:Math.round((done/totalTasks)*100),done,date:key}); }
    return result;
  }

  function getMonthData() {
    const daysInMonth = new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
    let totalPct=0, counted=0, result=[];
    for (let i=1;i<=daysInMonth;i++) { const d=new Date(now.getFullYear(),now.getMonth(),i); const key=getDateKey(d); const comp=store.completions[key]||{}; const done=Object.values(comp).filter(Boolean).length; const p=Math.round((done/totalTasks)*100); if(d<=now){totalPct+=p;counted++;} result.push({day:i,pct:p,isPast:d<=now}); }
    return {days:result, avg:counted?Math.round(totalPct/counted):0};
  }

  const hour = now.getHours();
  const greetPart = hour<12?t.morning:hour<17?t.afternoon:hour<21?t.evening:t.night;
  const weekData = getWeekData();
  const monthData = getMonthData();

  function getSmartReply(prompt) {
    const p = prompt.toLowerCase();

        "🍽️ वजन बढ़ाने के लिए कल का प्लान:\n\n☀️ सुबह: अंडे (3) + 2 ब्राउन रोटी + 1 केला\n🕛 दोपहर: राजमा-चावल (भरपूर) + सलाद + लस्सी\n🌿 शाम: ShakeMate शेक + 5-6 अखरोट\n🌙 रात: 3 रोटी + पनीर भुर्जी\n\n💪 याद रहे: प्रोटीन + कार्ब्स + हेल्दी फैट — तीनों जरूरी हैं!",
        "🥤 हेल्दी वेट गेन मील आइडियाज:\n\n🌅 सुबह: ओट्स + दूध + शहद + बादाम\n🍱 दोपहर: 4 रोटी + छोले + दही + सलाद\n☕ शाम: मूंगफली बटर टोस्ट + दूध\n🌙 रात: 3 रोटी + दाल मखनी\n\n✅ Afresh सुबह-दोपहर लेना न भूलें — metabolism बूस्ट होगी!"
      ] : [
        "🥗 Meal Plan for Tomorrow:\n\n🌅 Breakfast: Formula-1 (3 scoops) + milk + 2 banana shake\n🍱 Lunch: 4 Roti + Dal + Paneer sabzi + Curd\n🌿 Evening: Sprouts + handful of almonds\n🌙 Dinner: 3 Roti + Soya chunks sabzi\n\n💡 Tip: Drink 1-2 glasses of water with every meal. Calorie surplus is key for weight gain!",
        "🍽️ Weight Gain Meal Ideas:\n\n☀️ Morning: 3 Eggs + 2 brown rotis + 1 banana\n🕛 Lunch: Rajma-rice (generous) + salad + lassi\n🌿 Evening: ShakeMate shake + 5-6 walnuts\n🌙 Dinner: 3 Roti + Paneer bhurji\n\n💪 Remember: Protein + Carbs + Healthy fats — all three are essential!",
        "🥤 Healthy Calorie-Dense Options:\n\n🌅 Breakfast: Oats + milk + honey + almonds\n🍱 Lunch: 4 Roti + Chole + Curd + Salad\n☕ Evening: Peanut butter toast + milk\n🌙 Dinner: 3 Roti + Dal makhani\n\n✅ Don't skip Afresh morning & afternoon — it boosts your metabolism!"

    // ANALYZE / PROGRESS feature

        else msg += "💪 Every journey starts somewhere! Begin with completing just 5 tasks daily. Consistency beats perfection every time!";
        return msg;

    // MOTIVATION feature

      ] : [
        `🔥 ${streak}-day streak — that's YOUR power!\n\n"Weight gain is a journey, not a destination. Completing each task daily IS the victory."\n\n💪 You've done ${pct}% today — push for ${Math.min(pct+15,100)}% tomorrow!\n\n🌱 Remember: Trees don't grow overnight, but consistent watering makes them grow for sure.`,
        `🌟 You're doing amazing!\n\nYou completed ${completedCount} tasks today — this consistency WILL create massive change.\n\n💡 3 things that will accelerate your progress:\n1. Never skip your Formula-1 shake\n2. Sleep 7-8 hours every night\n3. Trust the process!\n\n🏆 Don't break your ${streak}-day streak!`,
        `💪 Hard work is never wasted!\n\nYour body is changing from the inside — it just takes time to show.\n\nYour mission right now: Complete ONE pending task in the next 10 minutes. Just one step!\n\n🔥 ${streak} days of streak — this is proof of your dedication!`
      ];
      return quotes[Math.floor(Math.random()*quotes.length)];
    }

    // SUPPLEMENT questions
    if (is("formula","shakemate","afresh","supplement","scoop","protein","सप्लीमेंट","स्कूप","प्रोटीन")) {
      return isHi
        ? "💊 सप्लीमेंट गाइड:\n\n🥤 Formula-1: 3 स्कूप सुबह 8 बजे — मुख्य न्यूट्रिशन शेक\n💪 ShakeMate: Formula-1 के साथ 2 स्कूप — प्रोटीन बूस्ट\n🌿 Afresh: सुबह 7 बजे + दोपहर 1 बजे — 1-1 स्कूप — metabolism बूस्टर\n\n✅ इन्हें ठंडे दूध या पानी में मिलाएं\n⚠️ इन्हें skip न करें — ये आपके plan का core हैं!"
        : "💊 Supplement Guide:\n\n🥤 Formula-1: 3 scoops at 8 AM — main nutrition shake\n💪 ShakeMate: 2 scoops with Formula-1 — protein boost\n🌿 Afresh: 7 AM + 1 PM — 1 scoop each — metabolism booster\n\n✅ Mix with cold milk or water\n⚠️ Never skip these — they are the core of your plan!";
    }

    // WATER / HYDRATION
    if (is("water","hydrat","पानी","हाइड्रेशन")) {
      return isHi
        ? "💧 हाइड्रेशन टिप्स:\n\n✅ रोज़ 10 गिलास पानी पिएं\n🕕 सुबह उठते ही 1 गिलास — metabolism शुरू होती है\n🍽️ खाने से 30 मिनट पहले पानी पिएं, बीच में नहीं\n🌙 रात को सोने से पहले 1 गिलास गुनगुना पानी\n\n💡 पानी पीने से nutrients absorb होते हैं और वजन बढ़ाने में मदद मिलती है!"
        : "💧 Hydration Tips:\n\n✅ Drink 10 glasses of water daily\n🕕 1 glass right after waking up — kickstarts metabolism\n🍽️ Drink water 30 min before meals, not during\n🌙 1 glass of warm water before sleeping\n\n💡 Proper hydration helps absorb nutrients and supports healthy weight gain!";
    }

    // SLEEP / REST
    if (is("sleep","rest","sona","नींद","आराम","सोना")) {
      return isHi
        ? "🌙 नींद और वजन बढ़ाना:\n\n✅ रोज़ 7-8 घंटे की नींद लें\n💪 नींद में Growth Hormone release होता है — यही असली muscle building होती है!\n📵 रात 10 बजे के बाद screen time कम करें\n🌡️ ठंडे कमरे में सोएं — बेहतर नींद आती है\n\n⚠️ नींद कम = वजन कम बढ़ेगा। Sleep is NOT optional!"
        : "🌙 Sleep & Weight Gain:\n\n✅ Get 7-8 hours of sleep daily\n💪 Growth Hormone is released during sleep — that's real muscle building!\n📵 Reduce screen time after 10 PM\n🌡️ Sleep in a cool room — better quality sleep\n\n⚠️ Less sleep = slower weight gain. Sleep is NOT optional!";
    }

    // EXERCISE / WORKOUT
    if (is("exercise","workout","gym","walk","yoga","व्यायाम","कसरत","जिम","योग")) {
      return isHi
        ? "🏋️ वजन बढ़ाने के लिए एक्सरसाइज:\n\n✅ हल्की strength training करें — squats, push-ups, pull-ups\n🚶 रोज़ 20-30 मिनट walk करें\n⚠️ बहुत ज़्यादा cardio avoid करें — calories burn होती हैं\n💪 हफ्ते में 3-4 दिन workout करें\n\n🎯 Goal: Muscle gain, न सिर्फ fat gain। Protein intake बढ़ाएं साथ में!"
        : "🏋️ Exercise for Weight Gain:\n\n✅ Light strength training — squats, push-ups, pull-ups\n🚶 20-30 min walk daily\n⚠️ Avoid excessive cardio — it burns too many calories\n💪 Workout 3-4 days per week\n\n🎯 Goal: Muscle gain, not just fat gain. Increase protein intake alongside!";
    }

    // DEFAULT / unknown question
    const defaults = isHi ? [
      `🤖 मैं आपका Diet Coach हूं!\n\nमैं इन topics पर मदद कर सकता हूं:\n🥗 मील प्लान सुझाव\n📊 प्रगति विश्लेषण\n💪 मोटिवेशन\n💊 सप्लीमेंट गाइड\n💧 हाइड्रेशन\n🌙 नींद\n🏋️ एक्सरसाइज\n\nआज आपने ${pct}% tasks पूरे किए — बढ़िया है! कोई specific सवाल पूछें।`,
      `🌿 नमस्ते! मैं केवल वजन बढ़ाने और आपके Diet Plan से जुड़े सवालों का जवाब दे सकता हूं।\n\nआज का status: ${completedCount}/${totalTasks} tasks ✅\n\nऊपर दिए buttons दबाएं या पूछें:\n- "कल का meal plan क्या हो?"\n- "मेरी progress कैसी है?"\n- "मुझे motivate करो"`
    ] : [
      `🤖 I'm your Diet Coach!\n\nI can help with:\n🥗 Meal plan suggestions\n📊 Progress analysis\n💪 Motivation\n💊 Supplement guide\n💧 Hydration tips\n🌙 Sleep advice\n🏋️ Exercise guidance\n\nYou've completed ${pct}% today — great work! Ask me anything specific.`,
      `🌿 I can only answer questions about weight gain and your Diet Plan.\n\nToday's status: ${completedCount}/${totalTasks} tasks ✅\n\nTry asking:\n- "What should I eat tomorrow?"\n- "How is my progress?"\n- "Motivate me!"`
    ];
    return defaults[Math.floor(Math.random()*defaults.length)];
  }

  function sendAI(customPrompt) {
    const prompt = customPrompt || aiInput.trim();
    if (!prompt) return;
    const userMsg = {role:"user", content:prompt};
    const newMsgs = [...aiMessages, userMsg];
    setAiMessages(newMsgs); setAiInput(""); setAiLoading(true);
    setTimeout(() => {
      const reply = getSmartReply(prompt);
      setAiMessages([...newMsgs, {role:"assistant", content:reply}]);
      setAiLoading(false);
    }, 800);
  }

  function triggerAIFeature(mode) {
    setTab("ai");
    if (mode==="meal") sendAI(lang==="hi"?"मुझे कल का मील प्लान सुझाएं":"Suggest a meal plan for tomorrow");
    else if (mode==="analyze") sendAI(lang==="hi"?"मेरी प्रगति का विश्लेषण करें":"Analyze my progress");
    else if (mode==="motivate") sendAI(lang==="hi"?"मुझे प्रेरित करें":"Motivate me");
  }

      h("div",{style:S.summaryCard},
        h("div",{style:S.summaryItem},h("span",{style:S.summaryNum},weekData.filter(d=>d.pct>=80).length),h("span",{style:S.summaryLbl},"🟢 "+(lang==="hi"?"अच्छे दिन":"Great Days"))),
        h("div",{style:S.summaryItem},h("span",{style:S.summaryNum},Math.round(weekData.reduce((a,d)=>a+d.pct,0)/7)+"%"),h("span",{style:S.summaryLbl},"📊 "+(lang==="hi"?"औसत":"Average"))),
        h("div",{style:S.summaryItem},h("span",{style:S.summaryNum},Math.max(...weekData.map(d=>d.pct))+"%"),h("span",{style:S.summaryLbl},"🏆 "+(lang==="hi"?"सर्वश्रेष्ठ":"Best Day")))
      ),
      h("button",{style:S.shareBtn,onClick:shareProgress},"📤 "+t.shareProgress)
    );
  }

  function renderMonthly() {
    const firstDay = new Date(now.getFullYear(),now.getMonth(),1).getDay();
    return h("div",null,
      h("div",{style:S.sectionHeader},
        h("span",null,t.monthlyReport),
        h("span",{style:S.monthAvg},t.months[now.getMonth()]+" · "+monthData.avg+"% "+(lang==="hi"?"औसत":"avg"))
      ),
      h("div",{style:S.calGrid},
        ...t.weekdays.map(d=>h("div",{key:d,style:S.calHead},d)),
        ...Array.from({length:firstDay},(_,i)=>h("div",{key:"e"+i})),
        ...monthData.days.map(d=>h("div",{key:d.day,style:{...S.calCell,background:!d.isPast?"#f5f5f5":d.pct>=80?"#C8E6C9":d.pct>=50?"#FFF9C4":d.pct>0?"#FFCDD2":"#EEEEEE",border:d.day===now.getDate()?"2px solid #2E7D32":"1px solid #eee",color:d.isPast?"#333":"#bbb"}},
          h("div",{style:S.calDay},d.day),
          d.isPast&&d.pct>0?h("div",{style:S.calPct},d.pct+"%"):null
        ))
      ),
      h("div",{style:S.calLegend},
        ...[["#C8E6C9","≥80%"],["#FFF9C4","50–79%"],["#FFCDD2","<50%"]].map(([c,l])=>
          h("div",{key:l,style:S.legendItem},h("div",{style:{...S.legendDot,background:c}}),l)
        )
      ),
      h("button",{style:S.shareBtn,onClick:shareProgress},"📤 "+t.shareProgress)
    );
  }

  function renderAI() {
    return h("div",null,
      h("div",{style:S.sectionHeader},h("span",null,"🤖 "+t.aiCoach)),
      h("div",{style:S.aiFeatures},
        h("button",{style:S.aiFeatureBtn,onClick:()=>triggerAIFeature("meal")},h("span",{style:S.aiFIcon},"🥗"),h("span",null,t.aiFeature1)),
        h("button",{style:S.aiFeatureBtn,onClick:()=>triggerAIFeature("analyze")},h("span",{style:S.aiFIcon},"📊"),h("span",null,t.aiFeature2)),
        h("button",{style:S.aiFeatureBtn,onClick:()=>triggerAIFeature("motivate")},h("span",{style:S.aiFIcon},"💪"),h("span",null,t.aiFeature3))
      ),
      h("div",{style:S.chatBox},
        aiMessages.length===0
          ? h("div",{style:S.chatEmpty},h("div",{style:{fontSize:40}},"🤖"),h("div",{style:{color:"#666",marginTop:8,fontSize:14,textAlign:"center"}},lang==="hi"?"नमस्ते! मैं आपका AI हेल्थ कोच हूं। ऊपर दिए बटन दबाएं या सीधे सवाल पूछें।":"Hi! I'm your AI health coach. Tap a feature above or ask me anything!"))
          : h("div",null,
              ...aiMessages.map((m,i)=>h("div",{key:i,style:{...S.chatMsg,...(m.role==="user"?S.chatUser:{})}},
                m.role==="assistant"?h("div",{style:S.chatIcon},"🤖"):null,
                h("div",{style:{...S.chatBubble,...(m.role==="user"?S.chatBubbleUser:S.chatBubbleAI)}},m.content)
              )),
              aiLoading?h("div",{style:S.chatMsg},h("div",{style:S.chatIcon},"🤖"),h("div",{style:S.chatBubbleAI},h("span",{className:"dots"},"●●●"))):null
            )
      ),
      h("div",{style:S.chatInputRow},
        h("input",{value:aiInput,onChange:e=>setAiInput(e.target.value),onKeyDown:e=>e.key==="Enter"&&sendAI(),placeholder:t.askAI,style:S.chatInput}),
        h("button",{style:S.chatSend,onClick:()=>sendAI(),disabled:aiLoading},t.aiSend)
      )
    );
  }

  return h("div",{style:S.root},
    ...renderConfetti(),
    renderHeader(),
    renderTabs(),
    h("div",{style:S.content},
      tab==="today"?renderToday():null,
      tab==="weekly"?renderWeekly():null,
      tab==="monthly"?renderMonthly():null,
      tab==="ai"?renderAI():null
    ),
    shareToast?h("div",{style:S.toast},"✅ "+t.copied):null
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App,null));
  </script>
</body>
</html>
